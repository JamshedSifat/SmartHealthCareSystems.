{% extends 'base.html' %}
{% load static %}

{% block title %}Delete Medicine{% endblock %}

{% block content %}
<div class="max-w-md mx-auto py-20 px-5">
    <div class="bg-white rounded-xl shadow-lg overflow-hidden">
        <div class="bg-gradient-to-r from-red-600 to-red-700 px-6 py-4">
            <h1 class="text-2xl font-bold text-white">
                <i class="fas fa-trash-alt mr-2"></i> Delete Medicine
            </h1>
        </div>
        
        <div class="p-6 text-center">
            <div class="text-red-500 mb-4">
                <i class="fas fa-exclamation-triangle text-6xl"></i>
            </div>
            
            <h2 class="text-xl font-bold text-gray-800 mb-2">Are you sure?</h2>
            <p class="text-gray-600 mb-6">
                You are about to delete <strong class="text-red-600">{{ medicine.name }}</strong>.<br>
                This action cannot be undone!
            </p>
            
            <div class="flex gap-3">
                <form method="post" class="flex-1">
                    {% csrf_token %}
                    <button type="submit" class="w-full bg-red-600 hover:bg-red-700 text-white py-2 rounded-lg font-semibold transition">
                        <i class="fas fa-trash-alt mr-1"></i> Yes, Delete
                    </button>
                </form>
                <a href="{% url 'appointments:add_medicine' %}" class="flex-1 text-center bg-gray-300 hover:bg-gray-400 text-gray-800 py-2 rounded-lg font-semibold transition">
                    <i class="fas fa-times mr-1"></i> Cancel
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
