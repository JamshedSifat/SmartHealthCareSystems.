{% extends 'base.html' %}
{% load static %}

{% block title %}Edit Medicine{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto py-10 px-5">
    <div class="bg-white rounded-xl shadow-lg overflow-hidden">
        <div class="bg-gradient-to-r from-blue-600 to-indigo-600 px-6 py-4">
            <h1 class="text-2xl font-bold text-white">
                <i class="fas fa-edit mr-2"></i> Edit Medicine
            </h1>
            <p class="text-blue-100 text-sm">Update medicine information</p>
        </div>
        
        <form method="post" class="p-6 space-y-4">
            {% csrf_token %}
            
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Medicine Name *</label>
                <input type="text" name="name" value="{{ medicine.name }}" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500">
            </div>
            
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Dosage *</label>
                <input type="text" name="dosage" value="{{ medicine.dosage }}" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500">
            </div>
            
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Frequency *</label>
                <input type="text" name="frequency" value="{{ medicine.frequency }}" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500">
            </div>
            
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Duration *</label>
                <input type="text" name="duration" value="{{ medicine.duration }}" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500">
            </div>
            
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Notes</label>
                <textarea name="notes" rows="3" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500">{{ medicine.notes }}</textarea>
            </div>
            
            <div class="flex gap-3 pt-4">
                <button type="submit" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white py-2 rounded-lg font-semibold transition">
                    <i class="fas fa-save mr-1"></i> Update Medicine
                </button>
                <a href="{% url 'appointments:add_medicine' %}" class="flex-1 text-center bg-gray-300 hover:bg-gray-400 text-gray-800 py-2 rounded-lg font-semibold transition">
                    <i class="fas fa-times mr-1"></i> Cancel
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
